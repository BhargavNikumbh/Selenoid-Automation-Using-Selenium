name: Selenium CI

on:
  push:
    branches:
      - "**"

  # Optional: also run for pull requests
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Setup Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 3. Verify Java and Maven
      - name: Display Java version
        run: java -version

      - name: Display Maven version
        run: mvn -version

      # 4. Build and run tests
      - name: Build and run tests
        run: mvn --batch-mode clean test -Denv=qa

      # 5. Upload test reports
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            test-output/
          if-no-files-found: ignore
